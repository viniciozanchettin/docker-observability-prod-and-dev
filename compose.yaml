name: web-stack

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  php-production:
    profiles: ["production"]
    build:
      context: ./docker/php
      args:
        PHP_VERSION: ${PHP_VERSION:-8.3}
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./apps/producao:/var/www/html
      - ./docker/php/production.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro
      - ./docker/php/www.conf:/usr/local/etc/php-fpm.d/zz-app.conf:ro
    logging: *default-logging

  nginx-production:
    profiles: ["production"]
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "${PRODUCTION_PORT:-8000}:80"
    environment:
      PHP_FPM_HOST: php-production
      NGINX_DOCUMENT_ROOT: ${PRODUCTION_DOCUMENT_ROOT:-/var/www/html/public}
    volumes:
      - ./apps/producao:/var/www/html:ro
      - ./docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - php-production
    logging: *default-logging

  php-development:
    profiles: ["development"]
    build:
      context: ./docker/php
      args:
        PHP_VERSION: ${PHP_VERSION:-8.3}
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./apps/desenvolvimento:/var/www/html
      - ./docker/php/development.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro
      - ./docker/php/www.conf:/usr/local/etc/php-fpm.d/zz-app.conf:ro
    logging: *default-logging

  nginx-development:
    profiles: ["development"]
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "${DEVELOPMENT_PORT:-8001}:80"
    environment:
      PHP_FPM_HOST: php-development
      NGINX_DOCUMENT_ROOT: ${DEVELOPMENT_DOCUMENT_ROOT:-/var/www/html/public}
    volumes:
      - ./apps/desenvolvimento:/var/www/html:ro
      - ./docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - php-development
    logging: *default-logging

  mysql:
    profiles: ["database"]
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "${MYSQL_BIND_ADDRESS:-127.0.0.1}:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *default-logging

  phpmyadmin:
    profiles: ["database"]
    image: phpmyadmin:5.2-apache
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: ${PHPMYADMIN_UPLOAD_LIMIT:-64M}
    ports:
      - "${PHPMYADMIN_PORT:-8002}:80"
    depends_on:
      mysql:
        condition: service_healthy
    logging: *default-logging

  loki:
    profiles: ["observability"]
    image: grafana/loki:3.4.2
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./docker/loki/config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging

  fluent-bit:
    profiles: ["observability"]
    image: fluent/fluent-bit:3.2.10
    restart: unless-stopped
    volumes:
      - ./docker/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - fluent-bit-state:/var/log/fluent-bit-storage
    depends_on:
      loki:
        condition: service_healthy
    logging: *default-logging

  docker-metrics:
    profiles: ["observability"]
    image: telegraf:1.34-alpine
    restart: unless-stopped
    user: telegraf
    group_add:
      - "0"
    volumes:
      - ./docker/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - /var/run/docker.sock:/var/run/docker.sock
    logging: *default-logging

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.2.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    logging: *default-logging

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.6.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      loki:
        condition: service_healthy
    logging: *default-logging

volumes:
  mysql-data:
  loki-data:
  grafana-data:
  prometheus-data:
  fluent-bit-state:
